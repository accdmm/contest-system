spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/contest_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# MinIO / S3 兼容对象存储
# 云部署示例(endpoint用MinIO服务名/公网IP):
#   Docker内网: http://minio:9000
#   公网IP直连: http://123.123.123.123:9000
#   阿里云OSS:  https://oss-cn-hangzhou.aliyuncs.com
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: contest-files
