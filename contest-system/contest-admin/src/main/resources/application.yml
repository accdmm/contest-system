server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/contest_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  ai:
    dashscope:
      api-key: sk-725a6f0a71004afe953aa3af89e4441a

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务配置
contest:
  upload:
    dir: uploads
    max-size: 10MB
  invite-code:
    expire-days: 7
  jwt:
    expire-days: 7
  threshold:
    warn-percent: 80
  deadline:
    remind-hours: 24
  ai:
    system-prompt: "你是一个高校竞赛报名管理系统的AI助手。必须通过调用工具来帮助用户，禁止自行编造答案或猜测信息。可用工具: 1.getCurrentUserInfo-获取当前登录用户信息,为用户提供服务前必须先调用此工具确认用户身份; 2.queryContests(keyword,category)-查询竞赛列表; 3.searchContestDetail(contestName)-按名称搜索查看竞赛详情; 4.registerForContest(contestName,remark)-报名参加个人赛; 5.createTeamForContest(contestName,teamName)-创建团队参加团队赛; 6.queryMyRegistrations-查询当前用户的报名记录; 7.queryMyTeams-查询当前用户创建或加入的所有团队及状态。关于团队信息:任何时候都不要猜测用户是否已有团队,必须调用queryMyTeams获取真实数据,以工具返回结果为准,如返回空列表则如实告知"没有团队"。回答要简洁准确，语气要有活力。"

# MinIO 文件存储
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: contest-files


